name: publish ikomida dev lib to artifact registry on pull request merge
on:
  pull_request_target:
    types:
      - closed
    branches:
      - dev
      - hmlg
      - main

env:
  GAR_LOCATION: us-central1 # # TODO: update region of the Artifact Registry
  GKE_CLUSTER: ikomida-cluster # TODO: update to cluster name
  GKE_ZONE: us-central1-b # TODO: update to cluster zone
  IMAGE: static-site

jobs:
  build_and_deploy_ikomida:
    if: github.event.pull_request.merged == true
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v3
      - id: "auth"
        name: "Authenticate to Google Cloud"
        uses: "google-github-actions/auth@v0"
        with:
          credentials_json: "${{ endsWith(github.ref, '/main') && secrets.BUILD_IKOMIDA_PROD_SERVICE_ACOUNT || (endsWith(github.ref, '/hmlg') && secrets.BUILD_IKOMIDA_HMLG_SERVICE_ACOUNT || secrets.BUILD_IKOMIDA_DEV_SERVICE_ACOUNT) }}"
      - name: Setup node
        uses: actions/setup-node@v3
        with:
          node-version: 16.x.x
          cache: yarn
      - name: Auth npm with artifactregistry and set gcloud project id
        env:
          PROJECT_ID: ${{ steps.auth.outputs.project_id }}
        run: |
          echo "Selected gcloud project id: ${PROJECT_ID}"
          rm .npmrc || true
          echo "@ikomida:registry=https://${GAR_LOCATION}-npm.pkg.dev/${PROJECT_ID}/node/" >> .npmrc
          echo "//${GAR_LOCATION}-npm.pkg.dev/${PROJECT_ID}/node/:always-auth=true" >> .npmrc
          yarn glogin
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Prepare code
        run: |
          yarn format
          yarn lint
      - name: Build code
        run: yarn build
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v0
      - name: Docker configuration
        run: |-
          gcloud auth configure-docker us-central1-docker.pkg.dev --project ikomida-dev
      - name: Set up GKE credentials
        run: |-
          gcloud container clusters get-credentials "${GKE_CLUSTER}" --zone "${GKE_ZONE}"

      - id: Cache
        name: get cache
        run: |-
          docker pull "${GAR_LOCATION}-docker.pkg.dev/${PROJECT_ID}/docker/contracts-microservice-image:latest"
      - name: Build
        run: |-
          docker build \
            --tag "${GAR_LOCATION}-docker.pkg.dev/${PROJECT_ID}/docker/contracts-microservice-image:latest" \
            --build-arg PROJECT_ID="${PROJECT_ID}" \
            --cache-from "${GAR_LOCATION}-docker.pkg.dev/${PROJECT_ID}/docker/contracts-microservice-image:latest" \
            .
      # Push the Docker image to Google Artifact Registry
      - name: Publish
        run: |-
          docker push "${GAR_LOCATION}-docker.pkg.dev/${PROJECT_ID}/docker/contracts-microservice-image:latest"

      - name: Deploy
        run: |-
          kubectl get pods
